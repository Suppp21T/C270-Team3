name: CI/CD - Test, Build, Push Docker Image

on:
  push:
    branches: [ "main", "testbranch" ]
  pull_request:
    branches: [ "main", "testbranch" ]

permissions:
  contents: read

env:
  IMAGE_NAME: caffeinatedkatze/perfume-site

jobs:
  test:
    name: CI - Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  build-and-push:
    name: CD - Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' # only push images on real pushes, not PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
