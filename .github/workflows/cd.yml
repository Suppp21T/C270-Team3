name: CD - Deploy to Production

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  # Note: Set up GitHub secrets before enabling deployment:
  # - DEPLOY_KEY (SSH private key)
  # - DEPLOY_HOST (server address)
  # - DEPLOY_USER (SSH username) 
  # - DEPLOY_PATH (remote directory path)
  # - DEPLOY_PORT (optional, defaults to 3000)

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r public/ deploy/
          cp -r views/ deploy/
          cp app.js deploy/
          cp server.js deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp README.md deploy/
          # Copy Docker files if deploying with Docker
          if [ -f Dockerfile ]; then cp Dockerfile deploy/; fi
          if [ -f docker-compose.yml ]; then cp docker-compose.yml deploy/; fi

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Add host to known_hosts
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          # Deploy using SCP
          scp -i ~/.ssh/deploy_key -r deploy/* $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
          
          # Restart application on remote server
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd $DEPLOY_PATH
          npm ci --production
          pm2 restart app || pm2 start server.js --name app
          EOF

      - name: Health check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '3000' }}
        run: |
          sleep 5
          curl -f http://$DEPLOY_HOST:$DEPLOY_PORT/ || exit 1

      - name: Notify deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const message = status === 'success' 
              ? '✅ Deployment successful!' 
              : '❌ Deployment failed!';
            console.log(message);
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : 'failure',
              context: 'Deployment',
              description: message
            });
